name: Build APK

on:
  push:
    branches: [ main, master, theme/android-five-presets ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Android SDK 34
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Copy APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/Resonix.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: resonix-debug-apk
          path: dist/Resonix.apk
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: Debug build ${{ github.run_number }} from commit ${{ github.sha }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/Resonix.apk --target "$GITHUB_SHA" --title "Resonix (latest build)" --notes "$NOTES" --prerelease